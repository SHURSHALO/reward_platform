version: '3.8'

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine


  web:
    build: .
    command: gunicorn backend.wsgi:application --bind 0.0.0.0:8000
    env_file: .env
    volumes:
      - .:/app

    ports:
      - "8000:8000"
    depends_on:
      - db

  celery:
    build: .
    command: celery -A backend worker --loglevel=info
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - redis

  celery-beat:
    build: .
    command: sh -c "python manage.py migrate && celery -A backend beat --loglevel=info"
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - redis

volumes:
  postgres_data:

